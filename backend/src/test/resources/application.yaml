spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

vault:
  env: development
  db:
    url: jdbc:postgresql://127.0.0.1:5432/postgres
    username: postgres
    password: test
  aws:
    region: us-east-1
    endpoint-url-s3: http://127.0.0.1:4566
    endpoint-url-sqs: http://127.0.0.1:4566
    access-key-id: test
    secret-access-key: test
  sqs:
    generation-queue-url: http://127.0.0.1:4566/000000000000/ai-fashion-vault-local-generation-work
  s3:
    avatar-bucket: ai-fashion-vault-local-avatar-private
    vault-bucket: ai-fashion-vault-local-vault-assets
    look-bucket: ai-fashion-vault-local-look-private
    temp-bucket: ai-fashion-vault-local-generation-temp
  fashn:
    api-key: test-fashn-key
  firebase:
    project-id: demo-ai-fashion-vault
  otel:
    service-name: ai-fashion-vault-api
