spring:
  datasource:
    url: ${vault.db.url}
    username: ${vault.db.username}
    password: ${vault.db.password}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
  cloudwatch2:
    metrics:
      export:
        # Micrometer CloudWatch2 step registry (micrometer-registry-cloudwatch2, BOM-managed
        # via micrometer-bom 1.17.0 imported by spring-boot-dependencies 4.1.0).
        # namespace must equal infra/alerts/variables.tf var.metric_namespace (default
        # "AI-Fashion-Vault"); step must not exceed the shortest alarm period in
        # infra/alerts (ai-quality-collapse period = 300s) so every alarm window sees data.
        enabled: ${CLOUDWATCH_METRICS_EXPORT:false}
        namespace: ${CLOUDWATCH_METRICS_NAMESPACE:AI-Fashion-Vault}
        step: 1m

vault:
  env: ${APP_ENV}
  db:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  retention:
    temporary-media-max-age: PT24H
  aws:
    region: ${AWS_REGION}
    endpoint-url-s3: ${AWS_ENDPOINT_URL_S3:}
    endpoint-url-sqs: ${AWS_ENDPOINT_URL_SQS:}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  sqs:
    generation-queue-url: ${SQS_GENERATION_QUEUE_URL}
  s3:
    avatar-bucket: ${S3_AVATAR_BUCKET}
    vault-bucket: ${S3_VAULT_BUCKET}
    look-bucket: ${S3_LOOK_BUCKET}
    temp-bucket: ${S3_TEMP_BUCKET}
  fashn:
    # Provider keys are OPTIONAL at boot (t220): an unset variable resolves to the empty
    # default below, which @ConditionalOnNonBlankApiKey treats as "no provider beans" —
    # the app boots honestly unavailable (503 GENERATION_PROVIDER_UNAVAILABLE on create).
    # Do NOT require these keys in VaultEnvironmentValidator or here.
    api-key: ${FASHN_API_KEY:}
  inferhub:
    api-key: ${VTON_IMAGE_API_KEY:}
  firebase:
    project-id: ${FIREBASE_PROJECT_ID}
  otel:
    service-name: ${OTEL_SERVICE_NAME}
    resource-attributes: ${OTEL_RESOURCE_ATTRIBUTES:}
    exporter-otlp-endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:}
    exporter-otlp-headers: ${OTEL_EXPORTER_OTLP_HEADERS:}
  # --- App attestation: NOT YET ENFORCING ---------------------------------------
  # All three flags below default to false, and they are false in every real
  # deployment. AppIntegrityBoundary therefore returns immediately and NO endpoint is
  # actually gated. These flags are the wiring point, not a working control.
  # Setting any of them to true today is fail-closed but NOT functional: no
  # IntegrityEvidenceProvider is registered and android-app-id / ios-app-id are
  # unset, so the verifier can never return VERIFIED and every request to a covered
  # endpoint would be answered 403 APP_INTEGRITY_REQUIRED. Do not enable without
  # selecting a real attestation provider and configuring both app ids first.
  # Covered when enabled: POST /generations, POST /looks/{id}/regenerate,
  # POST /avatars, PATCH /avatars/{id}.
  integrity:
    required: false
  avatar:
    # See the NOT YET ENFORCING note above; true today = 403 on all avatar writes.
    attestation-required: false
  generation:
    multi-item-enabled: false
    admission-paused: false
    # See the NOT YET ENFORCING note above; true today = 403 on all generation
    # writes, including POST /looks/{id}/regenerate.
    attestation-required: false
    queue:
      visibility-timeout-seconds: 120
      heartbeat-seconds: 45
      long-poll-seconds: 20
      receive-batch-size: 1
      main-retention-seconds: 345600
      dlq-retention-seconds: 1209600
      max-receive-count: 5
