spring:
  datasource:
    url: ${vault.db.url}
    username: ${vault.db.username}
    password: ${vault.db.password}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
  cloudwatch2:
    metrics:
      export:
        # Micrometer CloudWatch2 step registry (micrometer-registry-cloudwatch2, BOM-managed
        # via micrometer-bom 1.17.0 imported by spring-boot-dependencies 4.1.0).
        # namespace must equal infra/alerts/variables.tf var.metric_namespace (default
        # "AI-Fashion-Vault"); step must not exceed the shortest alarm period in
        # infra/alerts (ai-quality-collapse period = 300s) so every alarm window sees data.
        enabled: ${CLOUDWATCH_METRICS_EXPORT:false}
        namespace: ${CLOUDWATCH_METRICS_NAMESPACE:AI-Fashion-Vault}
        step: 1m

vault:
  env: ${APP_ENV}
  db:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  retention:
    temporary-media-max-age: PT24H
  aws:
    region: ${AWS_REGION}
    endpoint-url-s3: ${AWS_ENDPOINT_URL_S3:}
    endpoint-url-sqs: ${AWS_ENDPOINT_URL_SQS:}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  sqs:
    generation-queue-url: ${SQS_GENERATION_QUEUE_URL}
  s3:
    avatar-bucket: ${S3_AVATAR_BUCKET}
    vault-bucket: ${S3_VAULT_BUCKET}
    look-bucket: ${S3_LOOK_BUCKET}
    temp-bucket: ${S3_TEMP_BUCKET}
  fashn:
    # Provider keys are OPTIONAL at boot (t220): an unset variable resolves to the empty
    # default below, which @ConditionalOnNonBlankApiKey treats as "no provider beans" —
    # the app boots honestly unavailable (503 GENERATION_PROVIDER_UNAVAILABLE on create).
    # Do NOT require these keys in VaultEnvironmentValidator or here.
    api-key: ${FASHN_API_KEY:}
  inferhub:
    api-key: ${VTON_IMAGE_API_KEY:}
  firebase:
    project-id: ${FIREBASE_PROJECT_ID}
  otel:
    service-name: ${OTEL_SERVICE_NAME}
    resource-attributes: ${OTEL_RESOURCE_ATTRIBUTES:}
    exporter-otlp-endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:}
    exporter-otlp-headers: ${OTEL_EXPORTER_OTLP_HEADERS:}
  # --- App attestation: NOT YET ENFORCING ---------------------------------------
  # All three flags below default to false, and they are false in every real
  # deployment. AppIntegrityBoundary therefore returns immediately and NO endpoint is
  # actually gated. These flags are the wiring point, not a working control.
  # Setting any of them to true today is fail-closed but NOT functional: no
  # IntegrityEvidenceProvider is registered and android-app-id / ios-app-id are
  # unset, so the verifier can never return VERIFIED and every request to a covered
  # endpoint would be answered 403 APP_INTEGRITY_REQUIRED. Do not enable without
  # selecting a real attestation provider and configuring both app ids first.
  # Covered when enabled: POST /generations, POST /looks/{id}/regenerate,
  # POST /avatars, PATCH /avatars/{id}.
  integrity:
    required: false
  privacy:
    # C06: the policy version recorded on every consent grant. It is
    # configuration, not a compiled constant, so publishing a new policy is a
    # visible deployment change and the version stored on a grant is the one in
    # force when that grant was made. Bump it whenever the consent text changes.
    consent-policy-version: ${CONSENT_POLICY_VERSION:2026-10-03}
  avatar:
    # See the NOT YET ENFORCING note above; true today = 403 on all avatar writes.
    attestation-required: false
  generation:
    multi-item-enabled: false
    admission-paused: false
    # C19: approved generation admission caps. These ARE application
    # configuration (AdmissionCapsProperties, prefix vault.generation.admission)
    # and the store enforces exactly what is bound here. The values below
    # reproduce the caps this application previously compiled in as
    # AdmissionPolicy.DEFAULT (5 accepted jobs per 24h, 2 active jobs, 6
    # products per job); they are NOT an approved launch budget. Set the real
    # numbers for the deployment - env form VAULT_GENERATION_ADMISSION_* - and
    # an operator can then explain provider bill versus application accounting
    # without reading source. Values below 1 fail startup.
    admission:
      accepted-jobs-per-24-hours: 5
      max-active-jobs: 2
      max-products-per-job: 6
    # See the NOT YET ENFORCING note above; true today = 403 on all generation
    # writes, including POST /looks/{id}/regenerate.
    attestation-required: false
    # Approved generation spend caps (C19). These were previously hard-coded
    # constants in GenerationProcessorConfiguration; they are launch
    # configuration now, so the approved budget is visible and set per
    # environment rather than compiled in. The defaults below reproduce the
    # previous source values (USD 500 global / 25 per user / 250 per provider
    # per day). The per-provider ceiling applies to the provider the registry
    # selects at runtime. Set the env variables to an approved budget.
    spend:
      global-ceiling: ${GENERATION_SPEND_GLOBAL_CEILING:500.00}
      per-user-ceiling: ${GENERATION_SPEND_PER_USER_CEILING:25.00}
      provider-ceiling: ${GENERATION_SPEND_PROVIDER_CEILING:250.00}
      currency: ${GENERATION_SPEND_CURRENCY:USD}
      window: ${GENERATION_SPEND_WINDOW:1d}
    # Queue sizing is NOT application configuration. SQS visibility timeout, long
    # poll, message retention and redrive are provisioned with the queue itself
    # (infra/terraform/queue.tf, infra/docker/localstack_ready.py), and the
    # application-side values are the constants in SqsGenerationWorkQueue and
    # GenerationWorkProcessor. An earlier version of this file declared them
    # here, but no code ever read vault.generation.queue.* - changing them had
    # no effect, which is worse than not offering them. Resizing the queue means
    # changing provisioning and the matching constants together, and must keep
    # HEARTBEAT_INTERVAL_SECONDS < VISIBILITY_EXTENSION <= VISIBILITY_TIMEOUT_SECONDS
    # (pinned by GenerationWorkProcessorSlowProviderTest) so a multi-minute
    # provider call is never reaped mid-flight.
