name: mobile-init

on:
  push:
  pull_request:

jobs:
  linux-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.x'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  linux-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.x'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug
        working-directory: mobile/android

  windows-node:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.x'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  # Best-effort, not a required PR gate.
  # Consumes private-repo Actions minutes at the macOS rate.
  # macOS execution is unverified for this repository and no iOS build evidence is claimed by this repository's CI.
  # §57 keeps "iOS build on macOS runner" as "Optional later".
  macos-ios:
    runs-on: macos-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.x'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: pod install
        working-directory: mobile/ios
      - run: xcodebuild -workspace ios/AIFashionVault.xcworkspace -scheme AIFashionVault -configuration Debug CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -destination 'generic/platform=iOS' build
