name: repo-sanity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repo-sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repository-init invariants
        shell: bash
        run: |
          set -euo pipefail
          die() { echo "repo-sanity: $*" >&2; exit 1; }

          required=(
            README.md
            .gitignore
            .gitattributes
            .editorconfig
            docs/PRD.md
            docs/ARCHITECTURE.md
            docs/DATA_MODEL.md
            docs/API_CONTRACTS.md
            docs/PRIVACY.md
            docs/AI_EVALUATION.md
            docs/CONTRACT_INVENTORY.md
            docs/BASELINE.md
            docs/ADR/README.md
            .github/workflows/repo-sanity.yml
          )
          for path in "${required[@]}"; do
            [ -f "$path" ] || die "missing required file: $path"
          done

          inventory_docs=(
            docs/ARCHITECTURE.md
            docs/DATA_MODEL.md
            docs/API_CONTRACTS.md
            docs/PRIVACY.md
          )
          for path in "${inventory_docs[@]}"; do
            grep -q 'CONTRACT_INVENTORY.md' "$path" || die "canonical doc does not reference the contract inventory: $path"
          done

          prd_size=$(wc -c < docs/PRD.md | tr -d ' ')
          [ "$prd_size" -ge 5000 ] || die "docs/PRD.md is not substantive (${prd_size} bytes; need >= 5000)"
          grep -q 'Executive Summary' docs/PRD.md || die "docs/PRD.md missing 'Executive Summary'"

          grep -q 'ai-fashion-vault' README.md || die "README.md missing 'ai-fashion-vault'"
          grep -q 'Target topology' README.md || die "README.md missing 'Target topology'"
          grep -q 'docs/PRD.md' README.md || die "README.md missing docs/PRD.md reference"
          grep -q 'scripts/run_backend.py' README.md || die "README.md missing the current backend startup command"
          grep -q 'npm run test:ci' README.md || die "README.md missing the current mobile validation command"

          docs_links=(
            docs/PRD.md
            docs/ARCHITECTURE.md
            docs/DATA_MODEL.md
            docs/API_CONTRACTS.md
            docs/PRIVACY.md
            docs/AI_EVALUATION.md
            docs/CONTRACT_INVENTORY.md
            docs/BASELINE.md
            docs/ADR/README.md
          )
          for path in "${docs_links[@]}"; do
            [ -f "$path" ] || die "documentation link does not resolve: $path"
          done

          grep -q 'eol=lf' .gitattributes || die ".gitattributes must contain eol=lf"

          advanced=0
          if [ -f mobile/package.json ] || [ -d mobile/android ] || [ -d mobile/ios ] || [ -d mobile/src ]; then
            advanced=1
          fi
          if [ -f backend/pom.xml ] || [ -d backend/src ]; then
            advanced=1
          fi
          if [ -f compose.yaml ] || [ -f docker-compose.yml ]; then
            advanced=1
          fi
          if [ -d infra ] && find infra -type f ! -name '.gitkeep' -print -quit | grep -q .; then
            advanced=1
          fi

          if [ "$advanced" -eq 0 ]; then
            forbidden=(
              mobile/package.json
              mobile/android/
              mobile/ios/
              backend/pom.xml
              backend/src/
              compose.yaml
              docker-compose.yml
            )
            for path in "${forbidden[@]}"; do
              [ ! -e "$path" ] || die "greenfield-forbidden premature path: $path"
            done
          else
            echo "ADVANCED repository detected; skipping greenfield-forbidden path failures"
          fi

          secret_hits=0
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            base="${path##*/}"
            base_lc=$(printf '%s' "$base" | tr '[:upper:]' '[:lower:]')
            reject=0
            if [ "$base_lc" = '.env' ]; then
              reject=1
            elif [ "${base_lc#.env.}" != "$base_lc" ] && [ "$base_lc" != '.env.example' ]; then
              reject=1
            fi
            case "$base_lc" in
              *.pem|*.key|*.p12|*.pfx|*.jks|*.keystore|*.tfstate) reject=1 ;;
              *.tfvars.example) ;;
              *.tfvars) reject=1 ;;
              id_rsa|id_dsa|id_ecdsa|id_ed25519) reject=1 ;;
            esac
            if [ "$base_lc" = 'credentials' ]; then
              reject=1
            fi
            if [ "$reject" -eq 1 ]; then
              echo "repo-sanity: tracked secret-prone path: $path" >&2
              secret_hits=1
            fi
          done < <(git ls-files)
          [ "$secret_hits" -eq 0 ] || die "tracked secret-prone filenames are rejected"

          empty_tree=$(git hash-object -t tree /dev/null)
          git --no-pager diff --check "$empty_tree" HEAD -- . ':(exclude)*.md'

          crlf_hits=0
          while IFS= read -r -d '' path; do
            if grep -q $'\r' "$path"; then
              echo "repo-sanity: CRLF in tracked file: $path" >&2
              crlf_hits=1
            fi
          done < <(git ls-files -z -- '*.sh' '*.bash' '*.yml' '*.yaml' '*.md' '*.py')
          [ "$crlf_hits" -eq 0 ] || die "tracked *.sh/*.bash/*.yml/*.yaml/*.md/*.py must use LF"

          recognized_compose=(compose.yaml compose.yml docker-compose.yaml docker-compose.yml)
          found_compose=()
          for path in "${recognized_compose[@]}"; do
            [ -f "$path" ] && found_compose+=("$path")
          done
          if [ "${#found_compose[@]}" -eq 0 ]; then
            echo "Compose validation: N/A (no Compose file)"
          elif [ "${#found_compose[@]}" -gt 1 ]; then
            die "ambiguous Compose filenames (${found_compose[*]}); do not validate both or rely on Docker filename precedence"
          elif [ "${found_compose[0]}" != "compose.yaml" ]; then
            die "legacy Compose filename ${found_compose[0]}; canonical artifact is compose.yaml"
          else
            if ! docker compose version >/dev/null 2>&1; then
              die "Compose file exists but Docker Compose is unavailable"
            fi
            LOCALSTACK_AUTH_TOKEN=ci-placeholder POSTGRES_PASSWORD=ci-placeholder \
              docker compose -f compose.yaml config >/dev/null
          fi

      # F02/F15 gate. The backend (backend-init.yml) and mobile (mobile-init.yml)
      # suites are already PR-gated, but every suite passes while a client is
      # mounted with no API base URL / no token, or while every profile is
      # forced to answer UNAVAILABLE for malware inspection. These are greps over
      # the product source: no credential, no service, no network.
      - name: Runtime config is not stubbed (F02/F15)
        shell: bash
        run: |
          set -euo pipefail
          die() { echo "repo-sanity: $*" >&2; exit 1; }

          mobile_scope=(-- 'mobile/src/*.ts' 'mobile/src/*.tsx'
                        ':(exclude)**/*.test.ts' ':(exclude)**/*.test.tsx')

          if git grep -nE "baseUrl: *['\"]['\"]" -- "${mobile_scope[@]}"; then
            die "F02: a mobile client is mounted with an empty API baseUrl; it must read a real base URL at runtime"
          fi
          if git grep -nE "getAccessToken: *\(\) *=?> *null" -- "${mobile_scope[@]}"; then
            die "F02: a mobile client is mounted with a null access token; an absent token must be a visible refusal, not a null default"
          fi

          # The fail-closed UNAVAILABLE malware default is INTENDED and must stay
          # (ObjectStoreConfigurationTest.defaultMalwareScannerFailsClosed). The
          # defect is that it is unconditional: no profile can install an honest
          # scanner through the existing MalwareScanner seam, so
          # UploadWorkflow.java:104-106 fails EVERY upload in EVERY profile.
          # Scope the default; never satisfy this by removing the guarantee.
          while IFS= read -r scanner_default; do
            [ -n "$scanner_default" ] || continue
            if ! grep -qE '@Profile\(|@ConditionalOnMissingBean' "$scanner_default"; then
              die "F15: the fail-closed malware-scanner default in $scanner_default is unconditional, so no profile can supply a working scanner and every upload fails; scope it to a profile. Do NOT remove the fail-closed default."
            fi
          done < <(git grep -lE "new MalwareScanResult\(MalwareVerdict\.UNAVAILABLE" -- backend/src/main/java)

      - name: Local-dev init test
        shell: bash
        run: |
          if [ -f scripts/test_local_dev_init.py ]; then
            python3 scripts/test_local_dev_init.py
          else
            echo "Local-dev init test: N/A (scripts/test_local_dev_init.py not present)"
          fi

      - name: Repo-init idempotency seam
        shell: bash
        run: python3 scripts/test_repo_init.py
